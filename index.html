<script>
(() => {
  'use strict';
  const STORAGE_KEY='saldo-personal-finances-v1';
  const VAULT_KEY='saldo-pro-secure-v1';
  const defaultExpense=['Abitazione / Bollette','Alimentari','Macchina / Trasporti','Farmacia / Salute','Uscite e Passatempo','Viaggi','Shopping','Abbonamenti','Altro'];
  const defaultIncome=['Busta Paga','Mance','Lavoro Extra','Rimborsi','Regali','Altro'];
  const defaultData=()=>({transactions:[],recurring:[],budgets:{},skipped:[],categories:{expense:[...defaultExpense],income:[...defaultIncome]},icons:{},opening:null,theme:'light',reconciliations:[],goals:[],payday:27,backupReminder:null});
  const now=new Date();
  const state={page:'dashboard',month:now.getMonth(),year:now.getFullYear(),annualYear:now.getFullYear(),typeFilter:'all',categoryFilter:'all',search:'',data:defaultData()};
  const eur=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
  const formatMoney=n=>eur.format(Number(n)||0);
  const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const el=id=>document.getElementById(id);
  const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const cents=n=>Math.round((Number(n)||0)*100);
  const cash=n=>cents(n)/100;
  function safePayday(v){return Number.isInteger(v)&&v>=1&&v<=31?v:27}
  function safeReconciliations(rows){return Array.isArray(rows)?rows.filter(r=>r&&typeof r.id==='string'&&validDateString(r.date)&&Number.isFinite(r.actual)&&Math.abs(r.actual)<=999999999&&typeof r.expected==='number'&&Number.isFinite(r.expected)).slice(-500).map(r=>({id:r.id,date:r.date,actual:cash(r.actual),expected:cash(r.expected),note:String(r.note||'').slice(0,160)})):[]}
  function safeGoals(rows){return Array.isArray(rows)?rows.filter(r=>r&&typeof r.id==='string'&&typeof r.name==='string'&&r.name.trim()&&r.name.length<=70&&Number.isFinite(r.target)&&r.target>0&&r.target<=999999999&&Number.isFinite(r.saved)&&r.saved>=0&&r.saved<=999999999&&(!r.date||validDateString(r.date))).slice(0,100).map(r=>({id:r.id,name:r.name,target:cash(r.target),saved:cash(r.saved),date:r.date||''})):[]}
  const ICON_PALETTE=['🏠','🏡','🏢','🔑','💡','💧','🔥','🛠️','🛒','🥦','🍎','🍕','🥘','☕','🍷','🚗','🚕','🚌','🚆','🚲','⛽','🅿️','💊','🩺','🏥','🦷','💪','🏃','🎭','🎬','🎮','🎨','🎵','🎤','📚','✈️','🧳','🏖️','🏨','🛍️','👕','👟','💍','🔁','📱','💻','🌐','📺','🎁','🎂','🐶','🐈','🐾','👶','🎓','🏫','💼','💶','💰','💳','🏦','📈','🧾','🛡️','⚽','🏋️','🍀','🌱','💐','✂️','💇','🧹','🧴','📦','🚀','⭐','❤️','📌','🔔','🔧','🪙','🏆'];
  function validDateString(v){if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=new Date(v+'T12:00:00');return !Number.isNaN(d.valueOf())&&d.toISOString().slice(0,10)===v}
  function validateOpening(v){return v&&Number.isFinite(v.amount)&&Math.abs(v.amount)<=999999999&&validDateString(v.date)?{amount:Math.round(v.amount*100)/100,date:v.date}:null}
  function validateIcons(v){if(!v||typeof v!=='object'||Array.isArray(v))return {};return Object.fromEntries(Object.entries(v).filter(([k,ic])=>typeof k==='string'&&k.length<=80&&ICON_PALETTE.includes(ic)).slice(0,2000))}
  function confirmedBalance(){const o=state.data.opening;if(!o)return null;const cents=Math.round(o.amount*100)+state.data.transactions.filter(t=>t.date>=o.date&&t.date<=today()).reduce((acc,t)=>acc+(t.type==='income'?1:-1)*Math.round(t.amount*100),0);return cents/100}
  function load(){try{const v=localStorage.getItem(STORAGE_KEY);if(!v)return defaultData();const obj=JSON.parse(v);if(!obj||!Array.isArray(obj.transactions)||!obj.categories||!Array.isArray(obj.categories.expense)||!Array.isArray(obj.categories.income))throw Error('Formato non valido');return {opening:validateOpening(obj.opening),icons:validateIcons(obj.icons),budgets:obj.budgets&&typeof obj.budgets==='object'&&!Array.isArray(obj.budgets)?Object.fromEntries(Object.entries(obj.budgets).filter(([k,v])=>typeof k==='string'&&k.length<=55&&Number.isFinite(v)&&v>=0&&v<=999999999)): {},skipped:Array.isArray(obj.skipped)?obj.skipped.filter(x=>typeof x==='string'&&x.length<200):[],recurring:Array.isArray(obj.recurring)?obj.recurring.filter(r=>r&&typeof r.id==='string'&&Number.isFinite(r.amount)&&r.amount>0&&typeof r.description==='string'&&typeof r.category==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.start)&&(!r.end||/^\d{4}-\d{2}-\d{2}$/.test(r.end))&&['monthly','yearly','weekly'].includes(r.frequency)):[],transactions:obj.transactions.filter(t=>t&&typeof t.id==='string'&&['income','expense'].includes(t.type)&&typeof t.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&Number.isFinite(t.amount)&&t.amount>0&&typeof t.category==='string'&&typeof t.description==='string'),categories:{expense:obj.categories.expense.filter(x=>typeof x==='string'),income:obj.categories.income.filter(x=>typeof x==='string')},theme:obj.theme==='dark'?'dark':'light',reconciliations:safeReconciliations(obj.reconciliations),goals:safeGoals(obj.goals),payday:safePayday(obj.payday),backupReminder:typeof obj.backupReminder==='string'?obj.backupReminder:null};}catch(e){console.warn('Salvataggio non leggibile:',e);return defaultData()}}
  let vault=null, dataKey=null, active=false, lastActivity=Date.now(), hiddenAt=null, persistQueue=Promise.resolve(), writesPending=0;
  const bytes=n=>crypto.getRandomValues(new Uint8Array(n));

  function recurringForMonth(year,month){
    const first=`${year}-${String(month+1).padStart(2,'0')}-01`;
    const last=`${year}-${String(month+1).padStart(2,'0')}-${String(new Date(year,month+1,0).getDate()).padStart(2,'0')}`;
    const result=[];
    for(const r of state.data.recurring){
      if(r.start>last || (r.end && r.end<first))continue;
      const dates=[];
      const [sy,sm,sd]=r.start.split('-').map(Number);
      if(r.frequency==='monthly'){
        const monthIndex=(year-sy)*12+(month+1-sm);
        if(monthIndex>=0) dates.push(`${year}-${String(month+1).padStart(2,'0')}-${String(Math.min(sd,new Date(year,month+1,0).getDate())).padStart(2,'0')}`);
      }else if(r.frequency==='yearly'){
        if(year>=sy && month+1===sm)dates.push(`${year}-${String(month+1).padStart(2,'0')}-${String(Math.min(sd,new Date(year,month+1,0).getDate())).padStart(2,'0')}`);
      }else if(r.frequency==='weekly'){
        const startUTC=Date.UTC(sy,sm-1,sd);
        const firstUTC=Date.UTC(year,month,1);
        const weeks=Math.max(0,Math.ceil((firstUTC-startUTC)/(7*86400000)));
        for(let n=weeks;n<weeks+6;n++){
          const d=new Date(startUTC+n*7*86400000);
          if(d.getUTCFullYear()!==year||d.getUTCMonth()!==month)continue;
          dates.push(`${year}-${String(month+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`);
        }
      }
      for(const date of dates)if(date>=r.start&&(!r.end||date<=r.end)&&!state.data.skipped.includes(`${r.id}:${date}`)&&!state.data.transactions.some(t=>t.recurringId===r.id&&t.occurrenceDate===date))result.push({id:`rec:${r.id}:${date}`,recurringId:r.id,type:'expense',amount:r.amount,date,description:r.description,category:r.category,virtual:true});
    }
    return result;
  }

ew Intl.DateTimeFormat('it-IT',{month:'long'}).format(new Date(2024,r.month,1))}</td><td class="positive">${formatMoney(r.income)}</td><td class="negative">${formatMoney(r.expense)}</td><td class="${balanceClass(r.balance)}"><b>${signed(r.balance)}</b></td></tr>`).join('')}</tbody></table></div></section>`}

  function settleOccurrence(key){const idx=key.lastIndexOf(':');if(idx<0)return;const id=key.slice(0,idx),date=key.slice(idx+1),r=state.data.recurring.find(x=>x.id===id);if(!r||!validDate(date)||!recurringForMonth(Number(date.slice(0,4)),Number(date.slice(5,7))-1).some(t=>t.recurringId===id&&t.date===date))return toast('Scadenza già gestita.');state.data.transactions.push({id:uid(),type:'expense',amount:r.amount,date,description:r.description,category:r.category,recurringId:id,occurrenceDate:date});save();render();toast('Pagamento confermato e registrato nello storico.')}

  function renderSettings(){el('settingsPage').innerHTML=`<div class="narrow"><section class="panel"><h2>Aspetto</h2><p class="subtle">Scegli il tema dell'app.</p><button class="btn" id="themeToggle">${state.data.theme==='dark'?'☀ Passa alla modalità chiara':'☾ Passa alla modalità scura'}</button></section><section class="panel"><h2>Sicurezza e privacy</h2><p class="subtle">Archivio AES-GCM, PIN di 10 cifre e blocco automatico di 2 minuti quando la richiesta PIN è attiva. Per recuperare il PIN serve la chiave generata all’attivazione.</p><div class="info" style="margin:13px 0"><b>Richiesta PIN all'apertura: ${isFreeMode()?'DISATTIVATA':'ATTIVA'}</b><p style="margin:6px 0 0">${isFreeMode()?'Accesso immediato senza PIN. Chiunque possa aprire questa app su questo dispositivo può visualizzare i dati e copiarli. La chiave per decifrarli è memorizzata localmente.':'PIN richiesto all’apertura e blocco dopo 2 minuti di inattività.'}</p></div><div class="actions"><button class="btn primary" id="accessModeToggle">${isFreeMode()?'Attiva richiesta PIN':'Disattiva richiesta PIN'}</button><button class="btn" id="changePin">Cambia PIN</button>${isFreeMode()?'':'<button class="btn" id="lockNow">Blocca adesso</button>'}</div></section><section class="panel"><h2>Aggiornamenti app</h2><p class="subtle">Versione installata: <b id="installedAppVersion">7.0.0</b>. Controlla se GitHub Pages ha pubblicato una versione nuova. I dati personali non sono modificati dagli aggiornamenti del codice.</p><div class="info" id="updateStatus" role="status">Controllo aggiornamenti disponibile.</div><div class="actions" style="margin-top:12px"><button class="btn primary" id="checkAppUpdate">⟳ Controlla aggiornamenti</button><button class="btn hidden" id="applyAppUpdate">↓ Aggiorna ora</button></div></section><section class="panel"><h2>Backup e ripristino</h2><p class="subtle">I dati sono salvati solo in questo browser. Esporta regolarmente una copia JSON per non perderli se cancelli i dati del browser o   function render(){document.documentElement.dataset.theme=state.data.theme;const names={budgets:'Budget mensili',dashboard:'Panoramica',transactions:'Tutti i movimenti',recurring:'Spese ricorrenti',annual:'Bilancio annuale',categories:'Le tue categorie',insights:'Piano e analisi',settings:'Impostazioni'};el('pageTitle').textContent=names[state.page];document.querySelectorAll('.page').forEach(p=>p.classList.toggle('hidden',p.id!==`${state.page}Page`));document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===state.page);if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});el('monthControls').classList.toggle('hidden',!['dashboard','transactions'].includes(state.page));el('monthLabel').textContent=monthTitle(state.year,state.month);el('addTransaction').classList.toggle('hidden',!['dashboard','transactions'].includes(state.page));({dashboard:renderDashboard,transactions:renderTransactions,annual:renderAnnual,budgets:renderBudgets,recurring:renderRecurring,categories:renderCategories,settings:renderSettings,insights:renderInsights}[state.page])()}

  function actualAt(date){const o=state.data.opening;if(!o||date<o.date)return null;return (cents(o.amount)+state.data.transactions.filter(t=>t.date>=o.date&&t.date<=date).reduce((a,t)=>a+(t.type==='income'?cents(t.amount):-cents(t.amount)),0))/100}
  function nextPayday(){const d=new Date();const y=d.getFullYear(),m=d.getMonth(),day=safePayday(state.data.payday);let result=new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()),12);if(result<=d)result=new Date(y,m+1,Math.min(day,new Date(y,m+2,0).getDate()),12);return `${result.getFullYear()}-${String(result.getMonth()+1).padStart(2,'0')}-${String(result.getDate()).padStart(2,'0')}`}
  function upcomingDue(until){const start=today(),items=[];let year=Number(start.slice(0,4)),month=Number(start.slice(5,7))-1;for(let i=0;i<14;i++){if(`${year}-${String(month+1).padStart(2,'0')}-01`>until)break;for(const t of recurringForMonth(year,month)){if(t.date>=start&&t.date<=until)items.push(t)}month++;if(month===12){month=0;year++}}return items.sort((a,b)=>a.date.localeCompare(b.date))}
  function planMetrics(){const b=actualAt(today());const end=nextPayday();const due=upcomingDue(end);const dueCents=due.reduce((v,t)=>v+cents(t.amount),0);return {bank:b,end,due,amount:dueCents/100,available:b===null?null:(cents(b)-dueCents)/100}}
  function dashboardForecast(){const p=planMetrics();return `<section class="panel"><div class="panelhead"><h2>Disponibilità fino al prossimo stipendio</h2><button class="linkbtn" data-goto="insights">Apri piano →</button></div><p class="subtle">Stima fino al ${formatDate(p.end)}: ricorrenze non ancora pagate, senza entrate future ipotetiche né spese occasionali.</p><div class="summarytiles"><div><span class="subtle">Impegni previsti</span><strong>${formatMoney(p.amount)}</strong></div><div><span class="subtle">Disponibilità stimata</span><strong>${p.available===null?'Imposta saldo iniziale':balanceVisible?formatMoney(p.available):'•••••• €'}</strong></div></div></section>`}
  function insightsSnapshot(){const d=today(),p=planMetrics(),months=[];for(let i=5;i>=0;i--){const d0=new Date(Number(d.slice(0,4)),Number(d.slice(5,7))-1-i,1);const y=d0.getFullYear(),m=d0.getMonth();const rows=state.data.transactions.filter(t=>t.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}-`));let inc=0,exp=0;for(const t of rows){if(t.type==='income')inc+=cents(t.amount);else exp+=cents(t.amount)}months.push({name:new Intl.DateTimeFormat('it-IT',{month:'short'}).format(d0),income:inc/100,expense:exp/100,net:(inc-exp)/100})}return {p,months}}
  function renderInsights(){const {p,months}=insightsSnapshot(),totalIncome=months.reduce((a,r)=>a+cents(r.income),0),totalExpense=months.reduce((a,r)=>a+cents(r.expense),0),rate=totalIncome>0?Math.round((totalIncome-totalExpense)/totalIncome*100):null;const latest=[...state.data.reconciliations].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);const due=upcomingDue(new Date(Date.now()+45*86400000).toISOString().slice(0,10));const categories={};state.data.transactions.filter(t=>t.type==='expense'&&t.date>=new Date(new Date().getFullYear(),new Date().getMonth()-5,1).toLocaleDateString('sv-SE')).forEach(t=>{categories[t.category]=(categories[t.category]||0)+cents(t.amount)});const cats=Object.entries(categories).sort((a,b)=>b[1]-a[1]).slice(0,7);el('insightsPage').innerHTML=`<section class="panel"><div class="panelhead"><h2>🏦 Verifica del conto bancario</h2><button class="btn primary" id="newReconciliation">Confronta con la banca</button></div><p class="subtle">Confronta il saldo reale della banca con quello calcolato dall'app. Il confronto non modifica né il saldo né i movimenti.</p>${latest.length?latest.map(r=>`<div class="transaction"><div class="txtext"><strong>${formatDate(r.date)}</strong><small>${escapeHtml(r.note||'Verifica saldo')} · Banca ${formatMoney(r.actual)} · App ${formatMoney(r.expected)}</small></div><strong class="${cents(r.actual)-cents(r.expected)===0?'positive':'negative'}">${signed((cents(r.actual)-cents(r.expected))/100)}</strong></div>`).join(''):'<div class="info">Non hai ancora eseguito verifiche del saldo.</div>'}</section><section class="panel"><div class="panelhead"><h2>📅 Prossime scadenze</h2><span class="subtle">45 giorni</span></div>${due.length?due.map(t=>`<div class="transaction"><span class="txicon">${iconFor(t)}</span><div class="txtext"><strong>${escapeHtml(t.description)}</strong><small>${formatDate(t.date)} · ${escapeHtml(t.category)}</small></div><strong>${formatMoney(t.amount)}</strong></div>`).join(''):'<div class="info">Non risultano ricorrenze da pagare nei prossimi 45 giorni.</div>'}</section><section class="panel"><div class="panelhead"><h2>💳 Disponibilità fino al prossimo stipendio</h2></div><div class="field" style="max-width:250px"><label for="paydaySetting">Giorno del mese in cui ricevi lo stipendio</label><input id="paydaySetting" type="number" min="1" max="31" value="${safePayday(state.data.payday)}"></div><p class="subtle">Prossima data stimata: ${formatDate(p.end)}. Giorni 29–31 adattati alla fine del mese. Non vengono conteggiate entrate non ancora ricevute.</p><div class="summarytiles"><div><span class="subtle">Saldo attuale</span><strong>${p.bank===null?'Non configurato':balanceVisible?formatMoney(p.bank):'•••••• €'}</strong></div><div><span class="subtle">Ricorrenze future</span><strong>${formatMoney(p.amount)}</strong></div><div><span class="subtle">Disponibilità stimata</span><strong>${p.available===null?'—':balanceVisible?formatMoney(p.available):'•••••• €'}</strong></div></div></section><section class="panel"><div class="panelhead"><h2>🎯 Obiettivi di risparmio</h2><button class="btn primary" id="newGoal">Aggiungi obiettivo</button></div><p class="subtle">L'importo accantonato è un indicatore manuale: non viene sottratto automaticamente dal conto.</p>${state.data.goals.length?state.data.goals.map(g=>`<div class="categoryrow"><div class="catline"><b>${escapeHtml(g.name)}</b><span>${formatMoney(g.saved)} / ${formatMoney(g.target)}</span></div><div class="track"><div class="fill" style="width:${Math.min(100,Math.round(g.saved/g.target*100))}%"></div></div><div class="actions" style="margin-top:8px"><span class="subtle">${g.date?'Scadenza '+formatDate(g.date):'Senza scadenza'}</span><button class="mini" data-goal="${escapeHtml(g.id)}">Modifica</button><button class="mini danger" data-deletegoal="${escapeHtml(g.id)}">Elimina</button></div></div>`).join(''):'<div class="info">Crea un obiettivo per seguire i tuoi progressi.</div>'}</section><section class="panel"><div c   function reconcileDialog(){if(!state.data.opening){toast('Imposta prima il saldo iniziale del conto.');return}modal(`<div class="modalhead"><h2 id="modalTitle">Verifica saldo bancario</h2><button class="close" data-close>×</button></div><form id="reconcileForm"><div class="formgrid"><div class="field"><label>Data verifica</label><input id="reconcileDate" type="date" required value="${today()}" min="${state.data.opening.date}" max="${today()}"></div><div class="field"><label>Saldo letto in banca (€)</label><input id="reconcileActual" type="number" step="0.01" required></div><div class="field span2"><label>Nota facoltativa</label><input id="reconcileNote" maxlength="160" placeholder="Es. verifica estratto conto"></div></div><p class="info">Non vengono create correzioni automatiche.</p><div class="modalfoot"><button class="btn primary">Registra confronto</button></div></form>`);el('reconcileForm').onsubmit=e=>{e.preventDefault();const date=el('reconcileDate').value,actual=Number(el('reconcileActual').value),expected=actualAt(date);if(expected===null||!Number.isFinite(actual)||Math.abs(actual)>999999999){toast('Importo o data non validi');return}state.data.reconciliations.push({id:uid(),date,actual:cash(actual),expected:cash(expected),note:el('reconcileNote').value.trim()});save();closeModal();render();toast(`Differenza rilevata: ${formatMoney((cents(actual)-cents(expected))/100)}`)}}
  function goalDialog(id){const g=state.data.goals.find(g=>g.id===id);modal(`<div class="modalhead"><h2 id="modalTitle">${g?'Modifica':'Nuovo'} obiettivo</h2><button class="close" data-close>×</button></div><form id="goalForm"><div class="formgrid"><div class="field span2"><label>Nome obiettivo</label><input id="goalName" required maxlength="70" value="${escapeHtml(g?.name||'')}"></div><div class="field"><label>Obiettivo (€)</label><input id="goalTarget" type="number" step="0.01" min="0.01" required value="${g?.target??''}"></div><div class="field"><label>Accantonato (€)</label><input id="goalSaved" type="number" step="0.01" min="0" required value="${g?.saved??0}"></div><div class="field span2"><label>Data obiettivo (facoltativa)</label><input id="goalDate" type="date" value="${g?.date||''}"></div></div><div class="modalfoot"><button class="btn primary">Salva</button></div></form>`);el('goalForm').onsubmit=e=>{e.preventDefault();const candidate={id:g?.id||uid(),name:el('goalName').value.trim(),target:Number(el('goalTarget').value),saved:Number(el('goalSaved').value),date:el('goalDate').value};const valid=safeGoals([candidate]);if(!valid.length){toast('Controlla gli importi');return}if(g)Object.assign(g,valid[0]);else state.data.goals.push(valid[0]);save();closeModal();render();toast('Obiettivo salvato')}}
  async function exportSecureBackup(){const password=prompt('Scegli una password per CIFRARE il backup (minimo 12 caratteri). Non è il PIN.');if(password===null)return;if(password.length<12){toast('Password troppo breve: almeno 12 caratteri');return}if(prompt('Conferma la password del backup')!==password){toast('Le password non coincidono');return}try{await flush();const salt=b64(bytes(16)),iv=bytes(12),key=await deriv(password,salt);const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,utf(JSON.stringify({app:'Saldo',version:7,exportedAt:new Date().toISOString(),...state.data})));const payload=JSON.stringify({format:'saldo-pro-encrypted-backup-v1',kdf:'PBKDF2-SHA256',iterations:260000,salt,iv:b64(iv),cipher:b64(cipher)});const url=URL.createObjectURL(new Blob([payload],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`saldo-pro-backup-cifrato-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);state.data.backupReminder=today();save();toast('Backup cifrato esportato. Conserva la password separatamente.')}catch(err){console.error(err);toast('Errore cifratura backup')}}
  async function importSecureBackup(file){if(!file)return;if(file.size>5*1024*1024){toast('Backup troppo grande');return}const password=prompt('Inserisci la password del backup cifrato');if(!password)return;try{const p=JSON.parse(await file.text());if(p.format!=='saldo-pro-encrypted-backup-v1'||p.kdf!=='PBKDF2-SHA256'||p.iterations!==260000||![p.salt,p.iv,p.cipher].every(v=>typeof v==='string'&&v.length<10000000))throw Error('Formato non valido');const key=await deriv(password,p.salt),raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p.iv)},key,unb64(p.cipher));const json=dec(raw);importData(new File([json],'saldo-ripristino.json',{type:'application/json'}))}catch(e){toast('Password errata oppure backup non valido')}}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!active)return;if(b.id==='exportSecureBackup')exportSecureBackup();if(b.id==='importSecureBackup')el('encryptedFileInput').click();if(b.id==='newReconciliation')reconcileDialog();if(b.id==='newGoal')goalDialog();if(b.dataset.goal)goalDialog(b.dataset.goal);if(b.dataset.deletegoal&&confirm('Eliminare questo obiettivo?')){state.data.goals=state.data.goals.filter(g=>g.id!==b.dataset.deletegoal);save();render()} });
  document.addEventListener('change',e=>{if(e.target.id==='encryptedFileInput'){importSecureBackup(e.target.files?.[0]);e.target.value=''}if(e.target.id==='paydaySetting'){const v=Number(e.target.value);if(!Number.isInteger(v)||v<1||v>31){toast('Inserisci un giorno da 1 a 31');return}state.data.payday=v;save();render()}});

  // Aggiornamenti: versione remota indipendente dal contenuto finanziario.
  const APP_VERSION='7.0.0';
  let availableUpdate=null;
  let waitingWorker=null;
  let updateCheckBusy=false;
  let reloadOnControllerChange=false;
  function setUpdateStatus(message){const node=el('updateStatus');if(node)node.textContent=message}
  async function checkForUpdate(manual=false){
    if(updateCheckBusy)return;
    if(!('serviceWorker' in navigator)||location.protocol!=='https:'){
      if(manual)setUpdateStatus('Per aggiornare la PWA aprila dal tuo indirizzo HTTPS di GitHub Pages.');return;
    }
    updateCheckBusy=true;
    if(manual)setUpdateStatus('Controllo aggiornamenti in corso…');
    try{
      const reg=await navigator.serviceWorker.ready;
      await reg.update();
      const response=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});
      if(!response.ok)throw new Error('Versione remota non raggiungibile');
      const data=await response.json();
      if(!/^\d+\.\d+\.\d+$/.test(data.version))throw new Error('Versione remota non valida');
      const remote=data.version.split('.').map(Number),local=APP_VERSION.split('.').map(Number);
      const newer=remote.some((v,i)=>v>local[i]&&remote.slice(0,i).every((x,j)=>x===local[j]));
      waitingWorker=reg.waiting||null;
      if(newer){
        availableUpdate=data.version;
        setUpdateStatus('Nuova versione '+data.version+' disponibile. Salva prima un backup dei dati e premi Aggiorna ora.');
        el('applyAppUpdate')?.classList.remove('hidden');
      }else{
        availableUpdate=null;
        setUpdateStatus('Saldo Pro '+APP_VERSION+' è aggiornato.');
        el('applyAppUpdate')?.classList.add('hidden');
      }
    }catch(error){if(manual)setUpdateStatus('Controllo non riuscito. Verifica la connessione e che version.json sia pubblicato su GitHub Pages.');}
    finally{updateCheckBusy=false}
  }
  async function applyAppUpdate(){
    if(!availableUpdate)return;
    const btn=el('applyAppUpdate');if(btn)btn.disabled=true;
    setUpdateStatus('Preparazione nuova versione…');
    try{
      // Prima si completa la scrittura dell'archivio cifrato locale.
      await flush();
      const reg=await navigator.serviceWorker.getRegistration();
      if(!reg)throw new Error('PWA non registrata');
      await reg.update();
      const waiting=reg.waiting;
      if(waiting){
        reloadOnControllerChange=true;
        waiting.postMessage({type:'SKIP_WAITING'});
        setUpdateStatus('Attivazione aggiornamento…');
        setTimeout(()=>{if(reloadOnControllerChange)location.reload()},2500);
      }else{
        // La nuova versione potrebbe essere già in controllo oppure distribuita via network-first.
        location.reload();
      }
    }catch(error){setUpdateStatus('Aggiornamento non riuscito: riprova mentre sei online.');if(btn)btn.disabled=false}
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloadOnControllerChange){reloadOnControllerChange=false;location.reload()}});
    window.addEventListener('online',()=>checkForUpdate(false));
    setTimeout(()=>checkForUpdate(false),1800);
  }
  el('addTransaction').onclick=()=>openTransaction();el('prevMonth').onclick=()=>{state.month--;if(state.month<0){state.month=11;state.year--}render()};el('nextMonth').onclick=()=>{state.month++;if(state.month>11){state.month=0;state.year++}render()};initializeVault();
})();
</script>
